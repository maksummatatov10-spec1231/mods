plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"stormfang" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	// CI dev-test mode (real client screenshots): isolated run dir + quickPlay into the local server.
	// Enable with: ./gradlew runClient -Pdevtest  (StormfangDevHarness reads the system property)
	runs.configureEach { run ->
		if (run.name == 'client') {
			if (project.hasProperty('devtest')) {
				run.runDirectory = file('run-client')
				run.systemProperty 'stormfang.devtest', '1'
				run.programArgs '--quickPlayMultiplayer', 'localhost:25565'
			}
		}
	}
}

dependencies {
	// Mappings: official Mojang mappings (stable names for 1.21.x), see FabricMC/fabric-docs reference.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}
