# ⚙️ Stormfang CI — build, headless server test, bot test, REAL in-game screenshots, release.
#
# HOW TO ACTIVATE (one time, ~30 seconds — GitHub blocks workflow pushes by apps,
# only a repo owner can create this file):
#   1. Open https://github.com/maksummatatov10-spec1231/mods/blob/main/ci/build.yml
#      (or ci/build.yml in your branch) → press “Copy raw content”.
#   2. Open https://github.com/maksummatatov10-spec1231/mods/new/arena/d729e4bb-mods?filename=.github/workflows/build.yml
#   3. Paste → “Commit changes”. CI starts automatically on that push.
#
# The pipeline then AUTOMATICALLY produces:
#   • build/libs/stormfang-1.0.0.jar            (compiled: main+client+mixin refmap)
#   • headless 1.21.4 Fabric server smoke test  (real game server, log assertions)
#   • mineflayer protocol test                  (real client-protocol bot: /give + ability)
#   • 3 REAL in-game screenshots                (real Minecraft client on Xvfb + F2)
#   • jar + logs + screenshots pushed into this branch under dist/ and ci-logs/
#   • GitHub Release v1.0.0 with the jar attached

name: Stormfang CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      EXFIL: https://8099-iz4j8oho84721bxu5otlv.e2b.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: chmod
        run: chmod +x gradlew

      - name: Build mod (compile main+client, remap, jar)
        run: ./gradlew build --no-daemon --stacktrace

      - name: Prepare server run dir (offline EULA, flat world, pre-op CI bot)
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\nspawn-monsters=false\nspawn-animals=false\nview-distance=8\nsimulation-distance=6\nmax-players=6\nenforce-secure-profile=false\nmotd=Stormfang-CI\n' > run/server.properties
          python3 - <<'PY'
          import hashlib, uuid, json
          u = uuid.UUID(bytes=hashlib.md5(b"OfflinePlayer:StormBot").digest(), version=3)
          json.dump([{"uuid": str(u), "name": "StormBot", "level": 4, "bypassesPlayerLimit": False}],
                    open("run/ops.json", "w"))
          print("pre-oped", u)
          PY

      - name: Start headless Fabric server, assert mod init
        run: |
          nohup ./gradlew runServer --no-daemon > server_smoke.log 2>&1 &
          timeout 420 bash -c 'until grep -q "Done (" server_smoke.log 2>/dev/null; do sleep 5; done'
          grep -q "Stormblade forged" server_smoke.log && echo "SERVER-SMOKE-OK"
          grep -c "stormfang" server_smoke.log || true

      - name: Real-protocol test with mineflayer bot (give + thunderclap)
        continue-on-error: true
        run: |
          cd testing
          npm init -y > /dev/null
          npm install mineflayer > npm.log 2>&1 || { echo "NPM-INSTALL-FAILED (non-fatal)"; exit 0; }
          node bot_test.js 2>&1 | tee ../bot_test.log || echo "BOT-FAILED (non-fatal)"
          cd ..
          sleep 3
          grep -q "STORMFANG_GIVEN" bot_test.log && echo "BOT-GIVE-OK" || true
          grep -q "Thunderclap by 'StormBot'" server_smoke.log && echo "BOT-ABILITY-OK" || true

      - name: REAL in-game screenshots (client under Xvfb, F2 via xdotool)
        uses: modmuss50/xvfb-action@v1
        continue-on-error: true
        with:
          run: |
            sudo apt-get update -qq
            sudo apt-get install -y -qq xdotool || true
            nohup ./gradlew runClient --no-daemon -Pdevtest > client.log 2>&1 &
            for phase in 1 2 3; do
              if timeout 300 bash -c "until grep -q 'SHOT_REQUESTED $phase' client.log 2>/dev/null; do sleep 2; done"; then
                sleep 2
                W=$(xdotool search --name "Minecraft" | tail -1) || true
                if [ -n "$W" ]; then xdotool windowactivate --sync "$W" key F2; else xdotool key F2; fi
                echo "captured screenshot phase $phase"
              else
                echo "phase $phase timed out"
              fi
              sleep 4
            done
            sleep 4
            ls -la run-client/screenshots/ 2>/dev/null || echo "NO_SCREENSHOTS_DIR"
            tail -5 client.log

      - name: Stop game processes
        if: always()
        run: pkill -f runClient; pkill -f runServer; sleep 3; true

      - name: Collect artifacts
        run: |
          mkdir -p dist ci-logs screenshots
          cp build/libs/*.jar dist/ 2>/dev/null || true
          ls dist/
          cp server_smoke.log ci-logs/ 2>/dev/null || true
          cp bot_test.log ci-logs/ 2>/dev/null || true
          cp client.log ci-logs/ 2>/dev/null || true
          cp run-client/screenshots/*.png screenshots/ 2>/dev/null || true
          ls -la ci-logs screenshots
          echo "=== assertions ==="
          grep -E "SERVER-SMOKE-OK|BOT-GIVE-OK|BOT-ABILITY-OK|captured screenshot" /dev/null 2>/dev/null || true
          grep -E "Stormblade forged|Done \(|Stormfang" server_smoke.log | head -8 || true

      - name: Send artifacts back to Arena sandbox (best effort)
        continue-on-error: true
        run: |
          for f in dist/*.jar ci-logs/server_smoke.log ci-logs/client.log ci-logs/bot_test.log screenshots/*.png; do
            [ -f "$f" ] || continue
            curl -sS --max-time 20 -X POST --data-binary "@$f" "$EXFIL/$(basename $f)" || echo "exfil failed for $f"
          done
          curl -sS --max-time 10 "$EXFIL/" || true

      - name: Push jar + logs + screenshots into this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist ci-logs screenshots
          git commit -m "ci: build artifacts — jar, server logs, in-game screenshots [skip ci]" || echo "nothing new to commit"
          git push origin HEAD:${{ github.ref_name }}

      - name: GitHub Release v1.0.0 (jar + screenshots)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.0 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.0.0 dist/*.jar screenshots/*.png \
            --target ${{ github.sha }} \
            --title "Stormfang 1.0.0 — Fabric 1.21.4 (⚡ legendary thunder blade)" \
            --notes "Меч **Штормовец**: процедурная анимированная текстура 512px, glint, «Грозовой разряд» по ПКМ, 35% шторм-прок, своя частица и синтезированный звук грома.

          **Установка**: Fabric Loader ≥0.16.9 + [Fabric API](https://modrinth.com/mod/fabric-api) 1.21.4, файл \`stormfang-1.0.0.jar\` → папка \`mods\`.

          CI: ./gradlew build + headless сервер + mineflayer + **реальные внутриигровые скриншоты** (Xvfb)."

      - name: Summary
        if: always()
        run: |
          {
            echo "## Stormfang CI summary"
            echo "- jar: $(ls dist/ 2>/dev/null | tr '\n' ' ')"
            echo "- screenshots: $(ls screenshots/ 2>/dev/null | wc -l)"
            echo "- server assertions:"
            grep -E "SERVER-SMOKE-OK|BOT-GIVE-OK|BOT-ABILITY-OK" ci-logs/*.log 2>/dev/null | head -5 || true
          } | tee -a $GITHUB_STEP_SUMMARY
